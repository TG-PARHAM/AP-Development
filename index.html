<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیو توسعه بازی | AP-Development</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding-bottom: 60px; }

        header {
            background: rgba(21, 28, 44, 0.8); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; padding: 1.2rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo { font-size: 1.6rem; font-weight: 900; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); }
        .user-nav { display: flex; align-items: center; gap: 15px; }

        .btn-auth {
            background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-auth:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

        .hero { padding: 4rem 5% 2rem; text-align: center; max-width: 800px; margin: 0 auto; }
        .hero h1 {
            font-size: 2.8rem; margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, var(--accent-color));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 5%; }
        .section-title { font-size: 1.8rem; margin: 2rem 0 1rem; color: #fff; border-right: 4px solid var(--accent-color); padding-right: 10px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }

        .card {
            background: var(--card-bg); border-radius: 12px; padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; justify-content: space-between;
            text-align: center;
        }

        .card-emoji { font-size: 3.5rem; margin-bottom: 0.8rem; text-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .card h3 { color: var(--accent-color); }
        .card p { text-align: right; }

        .admin-actions { display: none; gap: 8px; }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.2); }

        #admin-panel {
            display: none; background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--accent-color); border-radius: 16px; padding: 2rem; margin-bottom: 3rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); text-align: right; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.8rem; background: #0f172a; border: 1px solid #334155;
            color: #fff; border-radius: 8px; outline: none; text-align: right;
        }

        .emoji-picker-container { display: flex; gap: 10px; align-items: center; }

        /* نوار پیشرفت آبی آسمونی */
        .progress-container {
            width: 100%; background: #0f172a; border-radius: 8px;
            overflow: hidden; margin-bottom: 1.2rem; display: none;
            border: 1px solid #334155;
        }
        .progress-bar {
            width: 0%; height: 22px; background: linear-gradient(90deg, #00bfff, #00ffcc);
            text-align: center; color: #000; font-weight: bold; font-size: 0.85rem;
            transition: width 0.2s ease; line-height: 22px;
        }

        .btn-submit {
            background: var(--accent-color); color: #000; border: none; padding: 0.8rem 1.5rem;
            border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--card-bg); padding: 2.5rem; border-radius: 16px;
            width: 100%; max-width: 400px; border: 1px solid var(--accent-color); position: relative;
        }

        .close-btn { position: absolute; top: 15px; left: 15px; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }
        .empty-msg { color: var(--text-muted); font-style: italic; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎮 AP-DEV</div>
        <div class="user-nav">
            <span id="user-display" style="display: none; color: var(--accent-color); font-weight: bold;"></span>
            <button class="btn-auth" id="auth-btn" onclick="openModal()">ورود / ثبت‌نام</button>
        </div>
    </header>

    <section class="hero">
        <h1>پرتال رسمی استودیو بازی‌سازی</h1>
        <p>به مرکز انتشار بازی‌ها و آخرین اخبار پروژه‌های ما خوش آمدید.</p>
    </section>

    <div class="container">

        <div id="admin-panel">
            <h2 id="panel-title" style="color: var(--accent-color); margin-bottom: 1.5rem; text-align: right;">⚙️ پنل مدیریت پرهام</h2>
            
            <div class="form-group">
                <label>نوع ارسال:</label>
                <select id="post-type" onchange="toggleExtraFields()">
                    <option value="game">🎮 آپلود بازی جدید</option>
                    <option value="news">📢 انتشار خبر جدید</option>
                </select>
            </div>

            <div class="form-group">
                <label>ایموجی کارت (تصویر بزرگ بالا):</label>
                <div class="emoji-picker-container">
                    <input type="text" id="post-emoji" value="🎮" style="font-size: 1.5rem; text-align: center; width: 80px;" maxlength="2">
                    <span style="font-size: 0.9rem; color: var(--text-muted);">مثل: 🎮، 🚀، ⚡، 💎</span>
                </div>
            </div>

            <div class="form-group">
                <label>عنوان:</label>
                <input type="text" id="post-title" placeholder="عنوان را وارد کنید...">
            </div>

            <div class="form-group">
                <label>توضیحات:</label>
                <textarea id="post-content" rows="3" placeholder="توضیحات کامل را بنویسید..."></textarea>
            </div>

            <div class="form-group" id="file-group">
                <label>انتخاب فایل بازی (آپلود مستقیم در گیت‌هاب):</label>
                <input type="file" id="post-file" style="padding: 0.5rem; background: #0f172a; color: #fff;">
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="savePostToGitHub()">ذخیره و انتشار در گیت‌هاب</button>
        </div>

        <h2 class="section-title">بازی‌های منتشر شده</h2>
        <div class="grid-container" id="games-list"></div>

        <h2 class="section-title">آخرین اخبار</h2>
        <div class="grid-container" id="news-list"></div>

    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-bottom: 1rem; color: var(--accent-color); text-align: right;">ورود به حساب</h3>
            <div class="form-group">
                <label>نام کاربری:</label>
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" id="password" placeholder="Password">
            </div>
            <button class="btn-submit" onclick="handleAuth()">ورود</button>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = "TG-PARHAM"; 
        const REPO_NAME = "AP-Development";

        let currentUser = null;
        let siteData = { games: [], news: [] };
        let fileSHA = "";
        let editingId = null;
        let currentFileUrl = "";

        const ADMIN_PASS_HASH = "8b34005dc9b049a4645ef20a8fa4ec6fb7efedaeeb8f1ef92c732a39d25700ca";

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('ap_dev_user');
            if (savedUser) currentUser = JSON.parse(savedUser);
            updateUI();
            fetchGitHubData();
        });

        function toggleExtraFields() {
            const type = document.getElementById('post-type').value;
            const fileGroup = document.getElementById('file-group');
            const emojiInput = document.getElementById('post-emoji');
            
            fileGroup.style.display = type === 'game' ? 'block' : 'none';
            emojiInput.value = type === 'game' ? '🎮' : '📢';
        }

        async function fetchGitHubData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json?timestamp=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    fileSHA = data.sha;
                    const decoded = decodeURIComponent(escape(atob(data.content)));
                    siteData = JSON.parse(decoded);
                    renderCards();
                } else {
                    siteData = { games: [], news: [] };
                    renderCards();
                }
            } catch (err) {
                console.error("خطا در دریافت داده‌ها:", err);
                siteData = { games: [], news: [] };
                renderCards();
            }
        }

        function renderCards() {
            const gamesList = document.getElementById('games-list');
            const newsList = document.getElementById('news-list');

            gamesList.innerHTML = siteData.games.length === 0 ? '<p class="empty-msg">هنوز بازی ثبت نشده است.</p>' : '';
            newsList.innerHTML = siteData.news.length === 0 ? '<p class="empty-msg">هنوز خبری ثبت نشده است.</p>' : '';

            siteData.games.forEach(game => {
                const emoji = game.emoji || '🎮';
                gamesList.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-emoji">${emoji}</div>
                            <div class="card-header">
                                <h3>${game.title}</h3>
                                <div class="admin-actions" style="display: ${currentUser && currentUser.isAdmin ? 'flex' : 'none'};">
                                    <button class="action-btn" onclick="editPost('${game.id}', 'game')" title="ویرایش">✏️</button>
                                    <button class="action-btn" onclick="deletePost('${game.id}', 'game')" title="حذف">🗑️</button>
                                </div>
                            </div>
                            <p>${game.content}</p>
                        </div>
                        ${game.fileUrl ? `<a href="${game.fileUrl}" target="_blank" class="btn-auth" style="display:inline-block; margin-top:1rem; text-decoration:none;">📥 دانلود بازی</a>` : ''}
                    </div>
                `;
            });

            siteData.news.forEach(news => {
                const emoji = news.emoji || '📢';
                newsList.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-emoji">${emoji}</div>
                            <div class="card-header">
                                <h3>${news.title}</h3>
                                <div class="admin-actions" style="display: ${currentUser && currentUser.isAdmin ? 'flex' : 'none'};">
                                    <button class="action-btn" onclick="editPost('${news.id}', 'news')" title="ویرایش">✏️</button>
                                    <button class="action-btn" onclick="deletePost('${news.id}', 'news')" title="حذف">🗑️</button>
                                </div>
                            </div>
                            <p>${news.content}</p>
                        </div>
                    </div>
                `;
            });
        }

        function uploadFileWithProgress(file) {
            return new Promise((resolve, reject) => {
                let token = localStorage.getItem('gh_token');
                const fileName = `uploads/${Date.now()}_${file.name}`;
                const reader = new FileReader();

                const container = document.getElementById('progress-container');
                const bar = document.getElementById('progress-bar');
                container.style.display = 'block';
                bar.style.width = '0%';
                bar.innerText = '0%';

                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        let percent = Math.round((e.loaded / e.total) * 50);
                        bar.style.width = percent + '%';
                        bar.innerText = percent + '%';
                    }
                };

                reader.onload = async function() {
                    const base64Content = reader.result.split(',')[1];
                    bar.style.width = '60%';
                    bar.innerText = '60% (در حال ارسال به گیت‌هاب...)';

                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${fileName}`, true);
                    xhr.setRequestHeader('Authorization', `token ${token}`);
                    xhr.setRequestHeader('Content-Type', 'application/json');

                    xhr.upload.onprogress = function(e) {
                        if (e.lengthComputable) {
                            let percent = 60 + Math.round((e.loaded / e.total) * 40);
                            bar.style.width = percent + '%';
                            bar.innerText = percent + '%';
                        }
                    };

                    xhr.onload = function() {
                        if (xhr.status === 201 || xhr.status === 200) {
                            const resData = JSON.parse(xhr.responseText);
                            bar.style.width = '100%';
                            bar.innerText = 'آپلود کامل شد!';
                            setTimeout(() => { container.style.display = 'none'; }, 1500);
                            resolve(resData.content.download_url);
                        } else {
                            container.style.display = 'none';
                            reject("خطا در آپلود فایل");
                        }
                    };

                    xhr.onerror = function() {
                        container.style.display = 'none';
                        reject("خطای شبکه");
                    };

                    xhr.send(JSON.stringify({
                        message: "آپلود فایل بازی جدید",
                        content: base64Content
                    }));
                };

                reader.readAsDataURL(file);
            });
        }

        async function savePostToGitHub() {
            const type = document.getElementById('post-type').value;
            const emoji = document.getElementById('post-emoji').value.trim() || (type === 'game' ? '🎮' : '📢');
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const fileInput = document.getElementById('post-file');

            if (!title || !content) return alert('لطفاً عنوان و توضیحات را وارد کنید.');

            let fileUrl = currentFileUrl;
            if (type === 'game' && fileInput.files.length > 0) {
                try {
                    fileUrl = await uploadFileWithProgress(fileInput.files[0]);
                } catch (e) {
                    return alert('آپلود فایل با خطا مواجه شد.');
                }
            }

            const list = type === 'game' ? siteData.games : siteData.news;

            if (editingId) {
                const item = list.find(i => i.id === editingId);
                if (item) {
                    item.emoji = emoji;
                    item.title = title;
                    item.content = content;
                    if (type === 'game') item.fileUrl = fileUrl;
                }
                editingId = null;
                currentFileUrl = "";
                document.getElementById('btn-submit').innerText = 'ذخیره و انتشار در گیت‌هاب';
            } else {
                const newItem = { id: 'id-' + Date.now(), emoji, title, content };
                if (type === 'game') newItem.fileUrl = fileUrl;
                list.push(newItem);
            }

            renderCards(); 
            await syncWithGitHub("تغییر اعمال و ذخیره شد");
        }

        async function deletePost(id, type) {
            if (type === 'game') {
                siteData.games = siteData.games.filter(g => g.id !== id);
            } else {
                siteData.news = siteData.news.filter(n => n.id !== id);
            }
            renderCards();
            await syncWithGitHub("تغییر اعمال و ذخیره شد");
        }

        function editPost(id, type) {
            const list = type === 'game' ? siteData.games : siteData.news;
            const item = list.find(i => i.id === id);
            if (!item) return;

            editingId = id;
            document.getElementById('post-type').value = type;
            toggleExtraFields();
            document.getElementById('post-emoji').value = item.emoji || '🎮';
            document.getElementById('post-title').value = item.title;
            document.getElementById('post-content').value = item.content;
            currentFileUrl = item.fileUrl || '';
            document.getElementById('btn-submit').innerText = 'ذخیره تغییرات در گیت‌هاب';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function syncWithGitHub(commitMessage) {
            let token = localStorage.getItem('gh_token');
            if (!token) {
                token = prompt("لطفاً Personal Access Token گیت‌هاب خود را وارد کنید:");
                if (token) localStorage.setItem('gh_token', token);
                else return alert("بدون توکن گیت‌هاب امکان ذخیره وجود ندارد.");
            }

            try {
                const freshRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json?timestamp=${Date.now()}`);
                if (freshRes.ok) {
                    const freshData = await freshRes.json();
                    fileSHA = freshData.sha;
                }
            } catch (e) {}

            try {
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(siteData, null, 2))));

                const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: contentEncoded,
                        sha: fileSHA !== "" ? fileSHA : undefined
                    })
                });

                if (res.ok) {
                    const resData = await res.json();
                    fileSHA = resData.content.sha;
                    alert('تغییر اعمال و ذخیره شد');
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-content').value = '';
                    document.getElementById('post-file').value = '';
                } else {
                    alert('خطا در همگام‌سازی با گیت‌هاب. لطفاً توکن خود را بررسی کنید.');
                    localStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
                alert('ارتباط با گیت‌هاب برقرار نشد.');
            }
        }

        function openModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

        async function handleAuth() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const inputHash = await hashString(pass);

            if (user === 'Parham' && (inputHash === ADMIN_PASS_HASH || pass === 'AP-Development1968')) {
                currentUser = { name: 'Parham', isAdmin: true };
            } else {
                currentUser = { name: user, isAdmin: false };
            }

            localStorage.setItem('ap_dev_user', JSON.stringify(currentUser));
            updateUI();
            closeModal();
            renderCards();
        }

        function updateUI() {
            const userDisplay = document.getElementById('user-display');
            const authBtn = document.getElementById('auth-btn');
            const adminPanel = document.getElementById('admin-panel');

            if (currentUser) {
                userDisplay.innerText = `👤 ${currentUser.name}`;
                userDisplay.style.display = 'inline';
                authBtn.innerText = 'خروج';
                authBtn.onclick = () => { 
                    currentUser = null; 
                    localStorage.removeItem('ap_dev_user'); 
                    updateUI(); 
                    renderCards(); 
                };
                if (currentUser.isAdmin) adminPanel.style.display = 'block';
            } else {
                userDisplay.style.display = 'none';
                authBtn.innerText = 'ورود / ثبت‌نام';
                authBtn.onclick = openModal;
                adminPanel.style.display = 'none';
            }
        }
    </script>
</body>
</html>
